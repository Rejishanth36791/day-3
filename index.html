<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMINA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#110b09] text-white font-serif">

    <nav class="relative bg-[#110b09] p-4 md:p-8 lg:px-12 flex justify-between items-center">
  <!--Brand logo-->
  <a href="#" class="flex items-center space-x-3">
    <span class="border border-white rounded-full p-2 text-sm">📷</span>
    <span class="text-lg md:text-xl tracking-widest uppercase">LUMINA</span>
  </a>

  <!--Desktop Menu-->
  <ul class="hidden md:flex space-x-8 text-sm uppercase tracking-wider">
    <li><a href="#" class="text-[#a32638]">Home</a></li>
    <li><a href="#portfolio" class="hover:text-[#a32638]">Portfolio</a></li>
    <li><a href="#about" class="hover:text-[#a32638]">About</a></li>
    <li><a href="#stories" class="hover:text-[#a32638]">Stories</a></li>
    <li><a href="#contact" class="hover:text-[#a32638]">Contact</a></li>
  </ul>

  <!--Mobile Hamburger Button-->
  <button id="menu-btn" class="block md:hidden text-2xl focus:outline-none">
    ☰
  </button>

  <!--Mobile Dropdown Menu-->
  <div id="mobile-menu" class="hidden md:hidden fixed inset-x-0 top-16 bottom-0 bg-[#faf9f8] text-black flex-col items-center justify-center space-y-8 text-xl z-50">
    <a href="#" class="text-[#a32638]">Home</a>
    <a href="#portfolio">Portfolio</a>
    <a href="#about">About</a>
    <a href="#stories">Stories</a>
    <a href="#contact">Contact</a>
  </div>
</nav>
<!--Hero section-->
<section class="px-4 pt-2 pb-8 md:px-8 lg:px-12 max-w-4xl mx-auto">
    <div class="relative w-full max-w-md mx-auto">
      <img
        src="image/gold-ring.jpg"
        alt="Gold Wedding Rings"
        class="w-[82%] ml-auto h-[460px] md:h-[520px] object-cover"
      />
      <img
        src="image/silver-ring.jpg"
        alt="Silver Ring"
        class="w-[56%] h-56 md:h-64 object-cover border-2 border-[#110b09] -mt-36 md:-mt-44 relative z-10"
      />
    </div>
  </section>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    let isOpen = false;

    menuBtn.addEventListener('click', () => {
      isOpen = !isOpen;
      mobileMenu.className = isOpen
        ? 'flex md:hidden fixed inset-x-0 top-16 bottom-0 bg-[#faf9f8] text-black flex-col items-center justify-center space-y-8 text-xl z-50'
        : 'hidden md:hidden';
      menuBtn.textContent = isOpen ? '✕' : '☰';
    });
  </script>
</body>
</html>


</body>
</html>
